<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Medalii Hwarang</title>
</head>

<body>

<h2>Sportivii Hwarang cu medalii</h2>

<div id="lista"></div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase, ref, get } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey:"XXXX",

authDomain:"XXXX",

databaseURL:"https://hwarang-1c5dc-default-rtdb.firebaseio.com",

projectId:"hwarang-1c5dc"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const lista = document.getElementById("lista");

const snapshot = await get(ref(db,"rezultate"));

snapshot.forEach(proba=>{

proba.forEach(categorie=>{

categorie.forEach(sportiv=>{

const data = sportiv.val();

if(data.club && data.club.includes("Hwarang")){

const div=document.createElement("div");

div.innerHTML = data.nume + " - loc " + data.loc;

lista.appendChild(div);

}

});

});

});

</script>

</body>
</html>
