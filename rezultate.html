<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rezultate Hwarang</title>

<style>

body{
font-family:Arial;
max-width:600px;
margin:auto;
padding:10px;
background:#f5f5f5;
}

.sportiv{
background:white;
padding:12px;
margin-bottom:8px;
border-radius:8px;
box-shadow:0 2px 4px rgba(0,0,0,.1);
}

.club{
font-size:13px;
color:gray;
}

</style>

</head>

<body>

<h2>Sportivi Hwarang</h2>

<select id="categorie"></select>

<div id="lista"></div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase, ref, get } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey:"XXXX",

authDomain:"hwarang-1c5dc.firebaseapp.com",

databaseURL:"https://hwarang-1c5dc-default-rtdb.firebaseio.com",

projectId:"hwarang-1c5dc"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const select = document.getElementById("categorie");
const lista = document.getElementById("lista");


// INCARCA CATEGORII

const snapshot = await get(ref(db,"sportivi"));

snapshot.forEach(cat=>{

const opt = document.createElement("option");

opt.value = cat.key;
opt.textContent = cat.key;

select.appendChild(opt);

});

loadSportivi();


// SCHIMBA CATEGORIE

select.addEventListener("change", loadSportivi);


// INCARCA SPORTIVI

async function loadSportivi(){

const categorie = select.value;

lista.innerHTML="Se incarca...";

const snap = await get(ref(db,"sportivi/"+categorie));

lista.innerHTML="";

snap.forEach(child=>{

const sportiv = child.val();

const div = document.createElement("div");

div.className="sportiv";

div.innerHTML = `
<b>${sportiv.nume}</b>
<div class="club">${sportiv.club}</div>
`;

lista.appendChild(div);

});

}

</script>

</body>
</html>
