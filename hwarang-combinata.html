<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getDatabase, ref, get } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAaYXqYOOfRxNplF5rhQN6Cr2qTkGPLji4",
authDomain: "hwarang-1c5dc.firebaseapp.com",
databaseURL: "https://hwarang-1c5dc-default-rtdb.firebaseio.com",
projectId: "hwarang-1c5dc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const lista = document.getElementById("lista");

async function load(){

lista.innerHTML="Se încarcă...";

const sportiviSnap = await get(ref(db,"sportivi"));
const compSnap = await get(ref(db,"competitie"));

const sportiviData = sportiviSnap.val();
const compData = compSnap.val();

lista.innerHTML="";

if(!sportiviData || !compData){
lista.innerHTML="Nu există date.";
return;
}

Object.keys(compData).forEach(categorie => {

const rezultate = compData[categorie];
const sportiviCat = sportiviData[categorie];

if(!rezultate || !sportiviCat) return;

let clubMap = {};

Object.values(sportiviCat).forEach(s=>{
if(s.nume) clubMap[s.nume]=s.club || "";
});

let arr=[];

Object.keys(rezultate).forEach(nume=>{

let d = rezultate[nume] || {};

arr.push({
nume:nume,
club:clubMap[nume] || "",
tull:calcTull(d.tull),
tehnici:parseFloat(d.tehnici||0),
dina:calcDina(d.dinamometru),
kick:parseFloat(d.speed_kick||0),
punch:parseFloat(d.speed_punch||0)
});

});

calculeaza(arr,"tull","tullRank","tullPts");
calculeaza(arr,"tehnici","tehniciRank","tehniciPts");
calculeaza(arr,"dina","dinaRank","dinaPts");
calculeaza(arr,"kick","kickRank","kickPts");
calculeaza(arr,"punch","punchRank","punchPts");

arr.forEach(s=>{
s.total =
s.tullPts +
s.tehniciPts +
s.dinaPts +
s.kickPts +
s.punchPts;
});

arr.sort((a,b)=>b.total-a.total);

arr.forEach((s,i)=>{

if(s.club && s.club.includes("Hwarang")){

const div=document.createElement("div");

div.style.background="white";
div.style.padding="10px";
div.style.marginBottom="8px";
div.style.borderRadius="6px";

div.innerHTML=`
<b>Loc ${i+1}</b><br>
${s.nume}<br>
<span style="color:gray">${s.club}</span><br>
<span style="color:#1a73e8">${categorie}</span>
`;

lista.appendChild(div);

}

});

});

}

function calcTull(t){
if(!t) return 0;
let v=Object.values(t).map(Number);
if(v.length===0) return 0;
return v.reduce((a,b)=>a+b,0)/v.length;
}

function calcDina(d){
if(!d) return 0;
let p1=parseFloat(d.p1||0);
let p2=parseFloat(d.p2||0);
let k1=parseFloat(d.k1||0);
let k2=parseFloat(d.k2||0);
return (Math.max(p1,p2)+Math.max(k1,k2))/2;
}

function calculeaza(arr,val,rank,pts){

arr.sort((a,b)=>b[val]-a[val]);

for(let i=0;i<arr.length;i++){

arr[i][rank]=i+1;

if(arr[i][rank]==1) arr[i][pts]=5;
else if(arr[i][rank]==2) arr[i][pts]=4;
else arr[i][pts]=3;

if(arr[i][val]==0) arr[i][pts]=0;

}

}

load();

</script>
