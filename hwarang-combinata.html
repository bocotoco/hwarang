<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sportivi Hwarang – Clasament combinat</title>

<style>
body{
font-family:Arial;
max-width:800px;
margin:auto;
padding:20px;
background:#f5f5f5;
}

h2{
text-align:center;
margin-bottom:20px;
}

.card{
background:white;
padding:12px;
margin-bottom:10px;
border-radius:6px;
box-shadow:0 2px 5px rgba(0,0,0,0.15);
}

.loc{
font-size:18px;
font-weight:bold;
}

.club{
color:#666;
font-size:13px;
}

.cat{
color:#1a73e8;
font-size:13px;
}
</style>
</head>

<body>

<h2>Sportivi Hwarang – Clasament combinat</h2>

<div id="lista">Se încarcă...</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getDatabase, ref, get } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAaYXqYOOfRxNplF5rhQN6Cr2qTkGPLji4",
authDomain: "hwarang-1c5dc.firebaseapp.com",
databaseURL: "https://hwarang-1c5dc-default-rtdb.firebaseio.com",
projectId: "hwarang-1c5dc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const lista = document.getElementById("lista");

async function load(){

try{

const sportiviSnap = await get(ref(db,"sportivi"));
const compSnap = await get(ref(db,"competitie"));

const sportivi = sportiviSnap.val();
const competitie = compSnap.val();

lista.innerHTML="";

if(!sportivi || !competitie){
lista.innerHTML="Nu există date.";
return;
}

Object.keys(competitie).forEach(cat=>{

const rez = competitie[cat];
const sportiviCat = sportivi[cat];

if(!rez || !sportiviCat) return;

let clubMap={};

Object.values(sportiviCat).forEach(s=>{
if(s.nume) clubMap[s.nume]=s.club||"";
});

let arr=[];

Object.keys(rez).forEach(nume=>{

let d=rez[nume]||{};

arr.push({
nume:nume,
club:clubMap[nume]||"",
tull:calcTull(d.tull),
tehnici:parseFloat(d.tehnici||0),
dina:calcDina(d.dinamometru),
kick:parseFloat(d.speed_kick||0),
punch:parseFloat(d.speed_punch||0)
});

});

calc(arr,"tull","tullRank","tullPts");
calc(arr,"tehnici","tehniciRank","tehniciPts");
calc(arr,"dina","dinaRank","dinaPts");
calc(arr,"kick","kickRank","kickPts");
calc(arr,"punch","punchRank","punchPts");

arr.forEach(s=>{
s.total=s.tullPts+s.tehniciPts+s.dinaPts+s.kickPts+s.punchPts;
});

arr.sort((a,b)=>b.total-a.total);

arr.forEach((s,i)=>{

if(s.club && s.club.includes("Hwarang")){

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="loc">Loc ${i+1}</div>
<b>${s.nume}</b><br>
<span class="club">${s.club}</span><br>
<span class="cat">${cat}</span>
`;

lista.appendChild(div);

}

});

});

}catch(err){
lista.innerHTML="Eroare: "+err;
console.error(err);
}

}

function calcTull(t){
if(!t) return 0;
let v=Object.values(t).map(Number);
if(v.length===0) return 0;
return v.reduce((a,b)=>a+b,0)/v.length;
}

function calcDina(d){
if(!d) return 0;
let p1=parseFloat(d.p1||0);
let p2=parseFloat(d.p2||0);
let k1=parseFloat(d.k1||0);
let k2=parseFloat(d.k2||0);
return (Math.max(p1,p2)+Math.max(k1,k2))/2;
}

function calc(arr,val,rank,pts){

arr.sort((a,b)=>b[val]-a[val]);

for(let i=0;i<arr.length;i++){

arr[i][rank]=i+1;

if(arr[i][rank]==1) arr[i][pts]=5;
else if(arr[i][rank]==2) arr[i][pts]=4;
else arr[i][pts]=3;

if(arr[i][val]==0) arr[i][pts]=0;

}

}

load();

</script>

</body>
</html>
